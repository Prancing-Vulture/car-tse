name: stage4_intent_tse_domain_norm_student_medium
sample_rate: 16000
segment_seconds: 2.0
manifest_train: stage4_intent_tse_domain_train.jsonl
manifest_eval: stage4_intent_tse_domain_eval.jsonl
source_manifest_train: stage4_cavemove_intent.jsonl
source_manifest_eval: stage4_cavemove_intent.jsonl
label_map: intent_label_map.json
waveform_cache_dir: data/cache/stage4_intent_tse_domain_16k_v4
waveform_cache_includes_cabin_noise: true

# Medium raw-audio student: retains the normalized/distilled recipe while
# adding capacity for the TSE/cabin domain.  This is a candidate only; the
# Wav2Vec checkpoint remains the default until the full comparison wins.
model:
  n_mels: 80
  hidden: 384
  num_layers: 2
  normalize_input: true

train:
  batch_size: 384
  val_batch_size: 512
  max_epochs: 10
  patience: 3
  lr: 7.5e-4
  grad_clip: 5.0
  amp: false
  balanced_sampler: true
  num_workers: 0
