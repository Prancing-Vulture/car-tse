name: stage1_spex_transfer_mc
sample_rate: 16000
segment_seconds: 3.0
multichannel: true
use_cabin_frontend: true
num_mics: 4
spex_backend: transfer_spexplus_16k

# Existing model trained on the full clean 16 kHz Libri2Mix corpus.
pretrained_checkpoint: "E:/prawin/snn/runs/spexplus_no_jepa_30/best.pt"

# Kept for config compatibility; the transfer backend takes its dimensions
# from the checkpoint metadata.
spex:
  L1_ms: 1.25
  L2_ms: 5.0
  L3_ms: 10.0
  N: 256
  B: 8
  O: 256
  P: 512
  Q: 3
  num_spks: 251
  spk_embed_dim: 256
  causal: false

frontend:
  ec_hidden: 128
  spatial_channels: 64

# The closed-set LibriSpeech speaker classifier is not a useful objective for
# open-set vehicle occupants, so transfer uses extraction loss only.
loss:
  alpha: 0.1
  beta: 0.1
  gamma: 0.0

train:
  batch_size: 2
  max_epochs: 6
  grad_clip: 5.0
  manifest: stage1_mc_triplets.jsonl
  val_manifest: stage1_mc_triplets.jsonl
  val_limit: 100
  val_batch_size: 2
  schedule:
    - epochs: [1, 2]
      freeze_spex: true
      lr_encoder: 0.0
      lr_rest: 0.0
      lr_frontend: 1.0e-4
    - epochs: [3, 6]
      freeze_spex: false
      freeze_encoder: true
      lr_encoder: 0.0
      lr_rest: 2.0e-5
      lr_frontend: 2.0e-5
