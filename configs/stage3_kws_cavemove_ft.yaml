model:
  n_mels: 40
  channels: [32, 64, 128]
  num_classes: 2

train:
  seed: 20261011
  batch_size: 512
  val_batch_size: 512
  max_epochs: 6
  patience: 2
  lr: 1.0e-4
  grad_clip: 5.0
  amp: false
  num_workers: 2
