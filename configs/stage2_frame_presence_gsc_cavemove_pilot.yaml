name: stage2_frame_presence_gsc_cavemove_pilot
sample_rate: 16000
segment_seconds: 3.0
manifest: stage2_presence_gsc_cavemove.jsonl
manifest_val: stage2_presence_gsc_cavemove.jsonl
stage1_config: configs/stage1_spex_transfer_mc_cavemove_e.yaml
spex_checkpoint: stage1_spex_transfer_mc_cavemove_cabin/best.pt
cabin_noise: true
num_mics: 4
cabin_noise_channels: [0, 2, 4, 6]
cabin_noise_snr_db: [-5.0, 0.0, 5.0, 10.0, 15.0, 20.0]
cabin_noise_cache_size: 32

model:
  n_mels: 40
  hidden: 64
  n_fft: 512
  hop: 160
  top_fraction: 0.20
  target_threshold_db_below_peak: 30.0

train:
  seed: 20261011
  batch_size: 8
  cache_batch_size: 8
  val_batch_size: 16
  max_epochs: 8
  lr: 1.0e-4
  grad_clip: 5.0
  positive_weight: 2.0
  smooth_weight: 0.02
  amp: true
  cache_stage1: true
  require_speaker_disjoint: true
  init_checkpoint: stage2_frame_presence_gsc_aishell_ft1/best.pt
  num_workers: 0
