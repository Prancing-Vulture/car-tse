name: stage1_spex_gsc_marvin_absent_adapt_ft3
sample_rate: 16000
segment_seconds: 3.0
multichannel: true
use_cabin_frontend: true
num_mics: 4
cabin_noise: true
cabin_noise_channels: [0, 2, 4, 6]
cabin_noise_snr_db: [-5.0, 0.0, 5.0, 10.0, 15.0, 20.0]
cabin_noise_cache_size: 32
cabin_noise_cache_dir: data/cache/cavemove_16k_mc
spex_backend: transfer_spexplus_16k
pretrained_checkpoint: "E:/prawin/snn/runs/spexplus_no_jepa_30/best.pt"

spex:
  L1_ms: 1.25
  L2_ms: 5.0
  L3_ms: 10.0
  N: 256
  B: 8
  O: 256
  P: 512
  Q: 3
  num_spks: 251
  spk_embed_dim: 256
  causal: false

frontend:
  ec_hidden: 128
  spatial_channels: 64

loss:
  alpha: 0.1
  beta: 0.1
  gamma: 0.0
  absent_output_penalty: 0.05

train:
  batch_size: 4
  train_limit: 1208
  max_epochs: 2
  grad_clip: 5.0
  amp: true
  manifest: stage1_gsc_marvin_cabin.jsonl
  val_split: val
  val_manifest: stage1_gsc_marvin_cabin.jsonl
  val_limit: 260
  val_batch_size: 4
  num_workers: 0
  init_checkpoint: stage1_spex_transfer_mc_cavemove_cabin/best.pt
  schedule:
    - epochs: [1, 1]
      freeze_spex: true
      lr_encoder: 0.0
      lr_rest: 0.0
      lr_frontend: 1.0e-5
    - epochs: [2, 2]
      freeze_spex: false
      freeze_encoder: true
      lr_encoder: 0.0
      lr_rest: 2.0e-6
      lr_frontend: 5.0e-6
