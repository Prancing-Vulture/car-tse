name: stage3_kws_clean_control
sample_rate: 16000
segment_seconds: 1.0
wake_word: marvin
manifest_train: ../clean_control/stage3_kws_clean_train.jsonl
manifest_val: ../clean_control/stage3_kws_clean_val.jsonl
manifest_eval: ../clean_control/stage3_kws_clean_test.jsonl
cabin_noise: false
audio_cache_size: 0
waveform_cache_includes_cabin_noise: false

model:
  n_mels: 40
  channels: [32, 64, 128]
  num_classes: 2

train:
  batch_size: 512
  val_batch_size: 512
  max_epochs: 12
  patience: 3
  lr: 1.0e-3
  grad_clip: 5.0
  amp: false
  num_workers: 0
