name: stage1_spex_clean_meanpool_eval
sample_rate: 16000
segment_seconds: 3.0
multichannel: false
use_cabin_frontend: false
num_mics: 4
cabin_noise: false
spex_backend: transfer_spexplus_16k
pretrained_checkpoint: "E:/prawin/snn/runs/spexplus_no_jepa_30/best.pt"

spex:
  L1_ms: 1.25
  L2_ms: 5.0
  L3_ms: 10.0
  N: 256
  B: 8
  O: 256
  P: 512
  Q: 3
  num_spks: 251
  spk_embed_dim: 256
  causal: false

train:
  batch_size: 1
  max_epochs: 1
  grad_clip: 5.0
  amp: true
  manifest: stage1_cavemove_cabin.jsonl
  val_manifest: stage1_cavemove_cabin.jsonl
  val_limit: 1
  val_batch_size: 1
  num_workers: 0
  schedule:
    - epochs: [1, 1]
      freeze_spex: true
      lr_encoder: 0.0
      lr_rest: 0.0
