name: stage3_kws_cavemove_hardneg_binary
sample_rate: 16000
segment_seconds: 1.0
wake_word: marvin
manifest_train: stage3_kws_cabin_hardneg_train.jsonl
manifest_val: stage3_kws_cabin_hardneg_val.jsonl
manifest_eval: stage3_kws_cabin_hardneg_test.jsonl
cabin_noise: true
cabin_noise_snr_db: [-5.0, 0.0, 5.0, 10.0, 15.0, 20.0]
cabin_noise_cache_size: 64
cabin_noise_cache_dir: data/cache/cavemove_16k
audio_cache_size: 2048
waveform_cache_dir: data/cache/stage3_kws_16k
waveform_cache_includes_cabin_noise: true

model:
  n_mels: 40
  channels: [32, 64, 128]
  num_classes: 2

train:
  batch_size: 512
  val_batch_size: 512
  max_epochs: 12
  patience: 3
  lr: 1.0e-3
  grad_clip: 5.0
  amp: false
  num_workers: 0
  prefetch_factor: 2
