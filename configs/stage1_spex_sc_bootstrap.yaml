# Short first run to validate the end-to-end data/model path on the local
# LibriSpeech-derived bootstrap corpus before committing to a long run.
name: stage1_spex_sc_bootstrap
sample_rate: 8000
segment_seconds: 4.0
multichannel: false
use_cabin_frontend: false

spex:
  L1_ms: 2.5
  L2_ms: 10.0
  L3_ms: 20.0
  N: 256
  B: 8
  O: 256
  P: 512
  Q: 3
  num_spks: 921
  spk_embed_dim: 256
  causal: false

loss:
  alpha: 0.1
  beta: 0.1
  gamma: 0.5

train:
  batch_size: 4
  max_epochs: 2
  grad_clip: 5.0
  manifest: stage1_triplets.jsonl
  schedule:
    - epochs: [1, 2]
      freeze_encoder: false
      lr_encoder: 1.0e-5
      lr_rest: 1.0e-4
