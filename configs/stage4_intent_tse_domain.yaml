name: stage4_intent_tse_domain_cavemove
sample_rate: 16000
segment_seconds: 2.0
manifest_train: stage4_intent_tse_domain_train.jsonl
manifest_eval: stage4_intent_tse_domain_eval.jsonl
source_manifest_train: stage4_fsc_cavemove_train.jsonl
source_manifest_eval: stage4_fsc_cavemove_valid.jsonl
label_map: intent_label_map.json
waveform_cache_dir: E:/car-tse-data/cache/stage4_intent_tse_domain_16k_v4
waveform_cache_includes_cabin_noise: true

# Fine-tune the existing cabin-trained classifier on the actual Stage 1
# extracted waveform distribution.  This is a separate candidate checkpoint.
pretrained_checkpoint: checkpoints/stage4_intent_cavemove_cabin/best.pt

model:
  n_mels: 80
  hidden: 256
  num_layers: 2

train:
  batch_size: 512
  val_batch_size: 512
  max_epochs: 8
  patience: 3
  lr: 2.0e-4
  grad_clip: 5.0
  amp: false
  balanced_sampler: true
  num_workers: 0
