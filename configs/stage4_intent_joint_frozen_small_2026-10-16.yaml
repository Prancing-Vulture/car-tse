name: stage4_intent_joint_frozen_small_2026-10-16
sample_rate: 16000
segment_seconds: 2.0
manifest_train: stage4_intent_joint_frozen_small_2026-10-16.jsonl
manifest_eval: stage4_intent_joint_frozen_small_2026-10-16.jsonl
label_map: intent_label_map.json
waveform_cache_dir: data/cache/stage4_intent_joint_frozen_small_2026-10-16_16k
waveform_cache_includes_cabin_noise: false
waveform_cache_train: train_joint_tse_overlap_wav_16000hz.npy
waveform_cache_eval: val_joint_tse_overlap_wav_16000hz.npy

# Stage 1 is an inference-only frozen frontend for this experiment. The
# downstream wav2vec encoder and intent head are the only trainable models.
model:
  encoder: facebook/wav2vec2-base-960h

train:
  clean_and_overlap_balanced: true
  passenger_snr_db: 0.0
