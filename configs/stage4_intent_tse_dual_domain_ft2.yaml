name: stage4_intent_tse_dual_domain_ft2
sample_rate: 16000
segment_seconds: 2.0
manifest_train: stage4_intent_tse_dual_domain_ft2_train.jsonl
manifest_eval: stage4_intent_tse_dual_domain_ft2_eval.jsonl
source_manifest_train: stage4_cavemove_intent.jsonl
source_manifest_eval: stage4_cavemove_intent.jsonl
label_map: intent_label_map.json
waveform_cache_dir: data/cache/stage4_intent_tse_dual_domain_ft2_16k_v1
