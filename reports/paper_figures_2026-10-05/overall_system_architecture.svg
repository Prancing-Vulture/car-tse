<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="540" viewBox="0 0 1920 540" role="img" aria-labelledby="title desc">
  <title id="title">Overall architecture of the enrolled-speaker in-car voice-command system</title>
  <desc id="desc">Four cabin microphones feed an optional learned cabin front end, which produces a mono signal. SpEx+ extracts speech conditioned on an enrolled voice. A target-presence gate passes speech to wake-word detection. A detected wake arms command capture; the next accepted target-speech window is classified for intent and mapped to a vehicle action or reply. An optional playback reference can enter the cabin front end.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5.5 1 10" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5.5 1 10" fill="none" stroke="#28627c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#18232e}
      .title{font-size:29px;font-weight:600;letter-spacing:.1px}
      .stage{font-size:23px;font-weight:600}
      .detail{font-size:18px;fill:#526170}
      .flow-label{font-size:16px;fill:#526170}
      .aux-label{font-size:16px;fill:#697785}
      .box{stroke-width:1.8;rx:8}
      .signal{fill:#edf4f7;stroke:#28627c}
      .decision{fill:#eef5ef;stroke:#456b53}
      .enrollment{fill:#fbf1e3;stroke:#a96724}
      .aux{fill:#f5f6f7;stroke:#8b96a1;stroke-width:1.5;rx:7}
      .flow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .cond-flow{fill:none;stroke:#a96724;stroke-width:2;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .optional-flow{fill:none;stroke:#8793a0;stroke-width:1.7;stroke-dasharray:5 5;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .signal-flow{fill:none;stroke:#28627c;stroke-width:2;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1920" height="650" fill="#ffffff"/>

  <text x="70" y="62" class="title">Enrolled-speaker cabin voice-command system</text>

  <!-- Inference path -->
  <rect x="70" y="195" width="180" height="132" class="box signal"/>
  <text x="160" y="243" text-anchor="middle" class="stage">Cabin audio</text>
  <text x="160" y="273" text-anchor="middle" class="detail">4 microphones</text>

  <rect x="300" y="195" width="190" height="132" class="box signal"/>
  <text x="395" y="239" text-anchor="middle" class="stage">Cabin front end</text>
  <text x="395" y="268" text-anchor="middle" class="detail">learned residual</text>
  <text x="395" y="288" text-anchor="middle" class="detail">+ spatial combination</text>

  <rect x="540" y="195" width="215" height="132" class="box signal"/>
  <text x="647.5" y="237" text-anchor="middle" class="stage">Target-speaker</text>
  <text x="647.5" y="262" text-anchor="middle" class="stage">extraction</text>
  <text x="647.5" y="292" text-anchor="middle" class="detail">SpEx+</text>

  <rect x="805" y="195" width="160" height="132" class="box decision"/>
  <text x="885" y="240" text-anchor="middle" class="stage">Target</text>
  <text x="885" y="265" text-anchor="middle" class="stage">presence</text>
  <text x="885" y="294" text-anchor="middle" class="detail">speech gate</text>

  <rect x="1015" y="195" width="160" height="132" class="box decision"/>
  <text x="1095" y="240" text-anchor="middle" class="stage">Wake-word</text>
  <text x="1095" y="265" text-anchor="middle" class="stage">detector</text>
  <text x="1095" y="294" text-anchor="middle" class="detail">“marvin”</text>

  <rect x="1225" y="195" width="160" height="132" class="box decision"/>
  <text x="1305" y="240" text-anchor="middle" class="stage">Intent</text>
  <text x="1305" y="268" text-anchor="middle" class="detail">classifier</text>
  <text x="1305" y="294" text-anchor="middle" class="detail">command</text>

  <rect x="1435" y="195" width="180" height="132" class="box decision"/>
  <text x="1525" y="240" text-anchor="middle" class="stage" style="font-size:19px">Intent-to-action</text>
  <text x="1525" y="265" text-anchor="middle" class="stage">mapping</text>
  <text x="1525" y="294" text-anchor="middle" class="detail">label → action / reply</text>

  <rect x="1665" y="195" width="185" height="132" class="box decision"/>
  <text x="1757.5" y="240" text-anchor="middle" class="stage">Vehicle action</text>
  <text x="1757.5" y="271" text-anchor="middle" class="detail">action / reply output</text>

  <!-- Main data flow -->
  <path d="M250 261H294" class="signal-flow"/>
  <path d="M490 261H534" class="signal-flow"/>
  <path d="M755 261H799" class="signal-flow"/>
  <path d="M965 261H1009" class="flow"/>
  <path d="M1175 261H1219" class="flow"/>
  <path d="M1385 261H1429" class="flow"/>
  <path d="M1615 261H1659" class="flow"/>

  <!-- Enrollment and optional playback reference -->
  <rect x="540" y="415" width="215" height="76" class="box enrollment"/>
  <text x="647.5" y="447" text-anchor="middle" class="stage" style="font-size:20px">Speaker enrollment</text>
  <text x="647.5" y="471" text-anchor="middle" class="detail">reference voice</text>
  <path d="M647.5 415V330" class="cond-flow"/>
  <text x="667" y="375" class="aux-label" fill="#8d571f">conditions extraction</text>

  <rect x="300" y="415" width="190" height="76" class="aux"/>
  <text x="395" y="447" text-anchor="middle" class="stage" style="font-size:20px">Playback reference</text>
  <text x="395" y="471" text-anchor="middle" class="detail">optional input</text>
  <path d="M395 415V330" class="optional-flow"/>

  <!-- State transition: wake and command are separate windows. -->
  <path d="M1095 327V415H1305V335" class="flow"/>
  <text x="1200" y="399" text-anchor="middle" class="flow-label">wake accepted → next target-speech window</text>
</svg>
